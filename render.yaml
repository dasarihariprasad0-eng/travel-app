services:
  - type: web
    name: direct-travel-api
    runtime: python
    rootDir: python-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://travel-app-vtce-qutszefm.onslate.in,https://travel-app-my31.onrender.com
      - key: SECURE_COOKIES
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: PASSWORD_RESET_SECRET
        generateValue: true
  - type: web
    name: direct-travel-web
    runtime: static
    rootDir: app
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://direct-travel-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
